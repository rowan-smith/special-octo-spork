[package]
name = "loadgen"
description = "Generates realistic structured telemetry against a Vyrtel server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
rand.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[bin]]
name = "loadgen"
path = "src/main.rs"

# Connection-pressure load for the transport limits (REL-18).
[[bin]]
name = "connload"
path = "src/connload.rs"

# Authenticated ingest under API key churn (AUTH-PERF-01).
[[bin]]
name = "keychurn"
path = "src/keychurn.rs"

# Session-cookie vs admin-key authentication under load (AUTH-PERF-02).
[[bin]]
name = "sessionauth"
path = "src/sessionauth.rs"

# API key last-used bookkeeping under many keys and key churn (AUTH-PERF-03).
[[bin]]
name = "keytouch"
path = "src/keytouch.rs"
